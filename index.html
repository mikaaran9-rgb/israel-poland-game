<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Same or Different? 🇮🇱 🇵🇱</title><style>
:root{font-family:ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;color:#1c2250;background:#f5f7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 10%,#e2e9ff,transparent 42%),radial-gradient(circle at 90% 90%,#ffe7e6,transparent 42%),#f8faff}.wrap{max-width:980px;margin:0 auto;padding:32px 18px 70px}.top{text-align:center;padding:20px 0 24px}.eyebrow{font-weight:800;letter-spacing:.19em;color:#6365bf;font-size:12px}.top h1{font-size:clamp(34px,6vw,62px);line-height:1.05;letter-spacing:-.06em;margin:15px 0 12px}.top h1 span{color:#6755e8}.sub{font-size:17px;color:#616985}.panel{background:#ffffffd9;border:1px solid #e8e9ff;border-radius:28px;padding:clamp(22px,5vw,38px);box-shadow:0 20px 70px #28366c15;max-width:690px;margin:0 auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.button,.country,.option{border:0;cursor:pointer;font:inherit;transition:transform .15s,box-shadow .15s}.button:hover,.country:hover,.option:hover{transform:translateY(-2px)}.button{background:#6755e8;color:white;padding:15px 22px;font-weight:800;border-radius:15px;box-shadow:0 8px 19px #6755e833}.button.secondary{background:#edf0ff;color:#5147b0;box-shadow:none}.button:disabled{opacity:.45;cursor:not-allowed;transform:none}.big{width:100%;padding:19px;font-size:17px}.country{background:#f5f6fd;border:2px solid #edf0ff;border-radius:19px;padding:22px 10px;font-weight:850;font-size:19px;color:#1c2250}.country.selected{background:#efedff;border-color:#6955ed;box-shadow:0 0 0 3px #6955ed13}.flag{font-size:36px;display:block;margin-bottom:7px}.field{display:block;width:100%;padding:17px 18px;border:2px solid #e6e8f6;border-radius:14px;font:inherit;font-size:24px;font-weight:800;text-align:center;letter-spacing:.22em;margin:14px 0 19px;outline:none}.field:focus{border-color:#6755e8}.muted{color:#77809c}.center{text-align:center}.roomcode{font-size:clamp(49px,11vw,80px);font-weight:950;letter-spacing:.12em;color:#6556dc;margin:4px 0}.pill{display:inline-block;background:#eef0ff;border-radius:999px;padding:8px 15px;font-size:13px;font-weight:800;color:#5559a0;margin:6px}.statbox{background:#f5f6ff;padding:17px;border-radius:16px;text-align:center;font-weight:850}.statbox .num{display:block;font-size:29px;color:#6353e8}.questionno{font-weight:800;color:#8177bd;text-align:center;letter-spacing:.09em;font-size:13px}.prompt{text-align:center;font-size:clamp(22px,4.5vw,34px);font-weight:900;margin:14px 0 25px}.versus{text-align:center;font-size:13px;font-weight:900;color:#8b93ac;align-self:center}.options{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}.option{min-height:170px;padding:16px 6px;background:#f0efff;border-radius:20px;border:3px solid transparent;font-weight:900;font-size:clamp(17px,3vw,25px);color:#383170}.option:nth-child(3){background:#fff0f1;color:#8c415f}.option.selected{border-color:#6857dc}.emoji{font-size:45px;display:block;margin-bottom:12px}.bar-row{margin:24px 0}.bar-label{display:flex;justify-content:space-between;font-size:18px;font-weight:800;margin-bottom:10px}.track{display:flex;height:35px;overflow:hidden;border-radius:10px;background:#eceef8}.segment{height:100%;display:flex;align-items:center;justify-content:center;color:white;font-weight:850;min-width:0;transition:width .3s}.segment.a{background:#6755e8}.segment.b{background:#f07c94}.legend{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin:14px 0 25px;font-weight:700;color:#636b89}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#6755e8;margin-right:5px}.dot.b{background:#f07c94}.notice{background:#f3f6ff;padding:17px;border-radius:16px;color:#505c85;font-weight:650;text-align:center;margin:18px 0}.line{height:1px;background:#e9ebf7;margin:22px 0}.small{font-size:13px}.gap{height:12px}.error{color:#bd3157;font-weight:750;text-align:center;margin-top:12px}.footer{text-align:center;color:#7f86a2;font-size:13px;margin-top:30px}#app{min-height:320px}@media(max-width:520px){.wrap{padding-top:15px}.panel{border-radius:21px;padding:21px}.options{gap:6px}.option{min-height:145px}.emoji{font-size:36px}}
</style></head><body><main class="wrap"><header class="top"><div class="eyebrow">ISRAEL × POLAND · MEET & CONNECT</div><h1>Same or <span>Different?</span> 🌍</h1><div class="sub">Two countries. One question. Let's compare!</div></header><div id="app"></div><footer class="footer">Made for an Israeli 🇮🇱 and Polish 🇵🇱 student meetup</footer></main><script>
const app=document.getElementById('app');let ws=null,role='',country='',code='',game=null,myVote=null,picked='',demo=false,ds={index:0,phase:'lobby',myVote:null},err='';
const qs=[['🏖️','Beach','🏊','Pool'],['☀️','Summer','❄️','Winter'],['🍕','Pizza','🍔','Burger'],['🐶','Dogs','🐱','Cats'],['🌅','Early bird','🌙','Night owl'],['🎬','Movies','📺','TV series'],['🏙️','Big city','🌳','Countryside'],['✈️','Travel abroad','🏡','Staycation'],['🍫','Chocolate','🍦','Ice cream'],['🎵','Music','🎮','Video games'],['📱','Texting','📞','Calling'],['⛰️','Mountains','🌊','Sea'],['📚','Books','🎥','Films'],['☕','Coffee','🫖','Tea'],['🎉','Big party','🛋️','Cozy evening']];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const panel=s=>`<section class="panel">${s}</section>`;
function connect(onopen){const proto=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(proto+'//'+location.host);ws.onopen=onopen;ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='error'){err=m.message;render();return;}if(m.type==='created'||m.type==='joined'){code=m.code;err='';}if(m.type==='state'){game=m;if(role==='player'){myVote=m.myVote;country=m.country;}}render();};ws.onclose=()=>{if(role&&!demo){err='Connection closed. Refresh to reconnect.';render();}};ws.onerror=()=>{err='Could not reach the game server.';render();};}
function home(){role='';demo=false;err='';if(ws)ws.close();ws=null;game=null;render()}
function create(){role='host';demo=false;err='';connect(()=>ws.send(JSON.stringify({type:'create'})));render()}
function joinScreen(){role='join';picked='';err='';render()}
function join(){const c=document.getElementById('room').value.trim();if(!/^\d{6}$/.test(c)||!picked){err='Enter the 6 digit room code and select a country.';render();return;}code=c;country=picked;role='player';err='';connect(()=>ws.send(JSON.stringify({type:'join',code,country})));render()}
function action(type,option){if(demo){if(type==='start')ds.phase='voting';if(type==='reveal')ds.phase='results';if(type==='vote')ds.myVote=option;if(type==='next'){ds.index++;ds.phase=ds.index>=qs.length?'finished':'voting';ds.myVote=null;}if(type==='restart')ds={index:0,phase:'lobby',myVote:null};render();return;}if(ws&&ws.readyState===1)ws.send(JSON.stringify({type,option}));}
function demoStart(){role='host';demo=true;code='DEMO';ds={index:0,phase:'lobby',myVote:null};render()}
function results(q,c){const opts=[q[1],q[3]];return `<div class="legend"><span><i class="dot"></i>${esc(opts[0])}</span><span><i class="dot b"></i>${esc(opts[1])}</span></div>${['Israel','Poland'].map(x=>{const v=c[x],t=v[0]+v[1],p=t?Math.round(v[0]/t*100):0;return `<div class="bar-row"><div class="bar-label"><span>${x==='Israel'?'🇮🇱':'🇵🇱'} ${x}</span><span class="muted">${t} votes</span></div><div class="track"><div class="segment a" style="width:${p}%">${p>=17?p+'%':''}</div><div class="segment b" style="width:${t?100-p:0}%">${t&&100-p>=17?(100-p)+'%':''}</div></div><div class="small muted" style="margin-top:5px">${v[0]} chose ${esc(opts[0])} · ${v[1]} chose ${esc(opts[1])}</div></div>`}).join('')}`}
function render(){let html='';if(!role){html=panel(`<div class="center"><h2>Ready to find out how alike we are?</h2><p class="muted">The host starts a room. Everyone joins from their phone and picks a country.</p></div><div class="gap"></div><div class="grid"><button class="button big" onclick="create()">🎤 I'm the host</button><button class="button secondary big" onclick="joinScreen()">🙋 Join a game</button></div><div class="line"></div><button class="button secondary big" onclick="demoStart()">✨ Try host demo</button><p class="muted small center">Live play requires the game to be running on a public server.</p>`)}
else if(role==='join'){html=panel(`<h2 class="center">Join the game 🎉</h2><p class="center muted">Enter the code shown on the host's screen</p><input id="room" class="field" inputmode="numeric" maxlength="6" placeholder="123456" value="${/^\d{0,6}$/.test(code)?code:''}"><h3 class="center">Where are you joining from?</h3><div class="grid"><button class="country ${picked==='Israel'?'selected':''}" onclick="pick('Israel')"><span class="flag">🇮🇱</span>Israel</button><button class="country ${picked==='Poland'?'selected':''}" onclick="pick('Poland')"><span class="flag">🇵🇱</span>Poland</button></div><div class="gap"></div><button class="button big" onclick="join()">Join room →</button><p class="error">${esc(err)}</p><p class="center"><button class="button secondary" onclick="home()">Back</button></p>`)}
else if(!game&&!demo){html=panel(`<h2 class="center">Connecting…</h2><p class="center muted">${esc(err)}</p><p class="center"><button class="button secondary" onclick="home()">Back</button></p>`)}
else{const g=demo?{code,phase:ds.phase,index:ds.index,total:qs.length,question:qs[Math.min(ds.index,qs.length-1)],participants:{Israel:12,Poland:8},voted:demo?Math.floor((ds.index*3+13)%21):0,counts:{Israel:[7+(ds.index%5),5-(ds.index%5)],Poland:[3+(ds.index%4),5-(ds.index%4)]}}:game;const host=role==='host';const q=g.question||qs[0],phase=g.phase;let s=`<div class="center"><span class="pill">${host?'🎤 HOST VIEW':'🙋 PLAYER VIEW'} ${demo?'· DEMO MODE':''}</span> <span class="pill">ROOM ${esc(g.code)}</span></div>`;
if(phase==='lobby'){s+=`<div class="center"><h2>${host?'Share this code with everyone':'You’re in! 🎉'}</h2>${host?`<div class="roomcode">${esc(g.code)}</div><p class="muted">Everyone opens this game's website and selects Join a game.</p>`:`<h2>${country==='Israel'?'🇮🇱 Israel':'🇵🇱 Poland'}</h2><p class="muted">Waiting for the host to start…</p>`}</div><div class="grid"><div class="statbox">🇮🇱 Israel<span class="num">${g.participants.Israel}</span></div><div class="statbox">🇵🇱 Poland<span class="num">${g.participants.Poland}</span></div></div>${host?`<div class="gap"></div><button class="button big" onclick="action('start')">🚀 Start game</button>`:''}`}
else if(phase==='finished'){s+=`<div class="center"><div style="font-size:56px">🎊</div><h2>Thanks for playing!</h2><p>Different answers. Great connections.</p>${host?`<button class="button" onclick="action('restart')">Play again</button>`:''}</div>`}
else{s+=`<p class="questionno">QUESTION ${g.index+1} OF ${g.total}</p><h2 class="prompt">Which would you choose?</h2><div class="options"><button class="option ${!host&&myVote===0?'selected':''}" ${host||phase!=='voting'||myVote!==null?'disabled':''} onclick="action('vote',0)"><span class="emoji">${q[0]}</span>${esc(q[1])}</button><div class="versus">OR</div><button class="option ${!host&&myVote===1?'selected':''}" ${host||phase!=='voting'||myVote!==null?'disabled':''} onclick="action('vote',1)"><span class="emoji">${q[2]}</span>${esc(q[3])}</button></div>`;
if(phase==='voting'){s+=`<div class="notice">${host?`${g.voted} of ${g.participants.Israel+g.participants.Poland} participants have voted${demo?' (sample)':''}.`:myVote!==null?'✅ Vote submitted! Waiting for results…':'👆 Tap your answer to vote!'}</div>${host?`<button class="button big" onclick="action('reveal')">📊 Reveal results</button>`:''}`}
else{s+=`<h3 class="center" style="margin:28px 0 0">How did each country vote?</h3>${results(q,g.counts)}${host?`<button class="button big" onclick="action('next')">${g.index+1===g.total?'🎉 Finish game':'Next question →'}</button>`:`<div class="notice">Waiting for the next question…</div>`}`}
}
if(host)s+=`<div class="line"></div><p class="center small muted">${demo?'This is a sample with simulated results. Launch the server for real multiplayer voting.':'Keep this page open during the game.'}</p>`;
html=panel(s)}app.innerHTML=html;}
function pick(v){const field=document.getElementById('room');if(field)code=field.value;picked=v;render()}
render();
</script></body></html>
